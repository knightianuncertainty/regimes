name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action hides Claude's output. When the review fails, print the
      # final message (an authentication or usage-limit error, for example).
      - name: Show why the review failed
        if: failure()
        run: |
          f="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$f" ]; then echo "no execution file"; exit 0; fi
          if jq -r '
              .. | objects
              | if .type? == "result" then
                  "result (\(.subtype // "?"), is_error \(.is_error // false)): \((.result // .error // .errors // "no text") | tostring)"
                elif .type? == "assistant" then
                  ((.message.content // []) | if type == "array" then map(.text? // empty) | join(" ") else tostring end
                   | select(length > 0) | "assistant: " + .)
                else empty end
            ' "$f" > "${RUNNER_TEMP}/review-messages.txt"; then
            cut -c1-600 "${RUNNER_TEMP}/review-messages.txt" | tail -n 5
          else
            tail -c 800 "$f"
          fi
